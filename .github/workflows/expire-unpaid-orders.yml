# .github/workflows/expire-unpaid-orders.yml
#
# Calls the expire-unpaid-orders cron endpoint every 15 minutes.
# This is the PRIMARY scheduler for Vercel Hobby plan (which only
# supports 1 daily cron). The vercel.json entry serves as a backup
# on Vercel Pro.
#
# Setup:
#   1. Add CRON_SECRET as a GitHub Actions secret (Settings > Secrets).
#   2. Add DEPLOY_URL as a secret, e.g. https://your-app.vercel.app
#   3. The workflow is free on public repos. Private repos get 2000
#      minutes/month on the Free plan — this uses ~120 min/month.

name: Expire Unpaid Orders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call expire endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DEPLOY_URL }}/api/cron/expire-unpaid-orders")
          cat /tmp/response.txt
          echo ""
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cron endpoint returned $HTTP_CODE"
            exit 1
          fi
